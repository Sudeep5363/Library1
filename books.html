<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse library books collection">
    <title>Browse Books - Library Management System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Library Books Collection</h1>
            <p>Discover thousands of books in our collection</p>
            <div class="nav-links">
                <a href="index.html" class="btn btn-primary">Home</a>
                <a href="books.html" class="btn btn-primary">Browse Books</a>
            </div>
        </header>

        <main>
            <div class="form-container">
                <div class="form-group">
                    <label for="searchBox">Search Books by Title or Author</label>
                    <input 
                        type="text" 
                        id="searchBox" 
                        placeholder="Type to search..."
                    >
                </div>
            </div>

            <h2>Available Books</h2>
            <div class="book-grid" id="bookGrid">
                <!-- Books will be loaded here -->
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Library Management System. All rights reserved.</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
